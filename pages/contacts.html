<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портфолио - Контакты</title>
    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="nav-container">
                <div class="logo-section">
                    <div class="logo"><img src="/images/icons/picture1.png" class="logo"></div>
                    <div class="name">Зайнуллин Яков</div>
                </div>
                <ul class="nav-menu">
                    <li><a href="../index.html">Главная</a></li>
                    <li><a href="projects.html">Проекты</a></li>
                    <li><a href="diary.html">Дневник</a></li>
                    <li><a href="contacts.html" class="active">Контакты</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main style="margin-top: 100px; padding: 2rem;">
        <div class="container">
            <div class="page-header">
                <h1>Свяжитесь со мной</h1>
                <p>Буду рад обсудить возможности сотрудничества</p>
            </div>
            
            <div class="contacts-layout">
                <div class="contact-form">
                    <form id="contactForm">
                        <div class="form-group">
                            <label for="name">Имя:</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email:</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="message">Сообщение:</label>
                            <textarea id="message" name="message" rows="5" required></textarea>
                        </div>
                        <button class="submit-btn">Отправить сообщение</button>
                    </form>
                </div>
                
                <div class="contact-info">
                    <h3>Контакты</h3>
                    <div class="contact-item">
                        <span class="contact-icon">📧</span>
                        <span>student@edu.ru</span>
                    </div>
                    <div class="contact-item">
                        <span class="contact-icon">💻</span>
                        <span>GitHub: <a href="https://github.com/nizi52" target="_blank" class="github-link">nizi52</a></span>
                    </div>
                    <div class="contact-item">
                        <span class="contact-icon">🏙️</span>
                        <span>Москва, Россия</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>© 2025 Контакты <a href="https://github.com/nizi52" target="_blank" class="github-link">GitHub</a></p>
        </div>
    </footer>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Сообщение отправлено! Спасибо за ваше обращение.');
            this.reset();
        });
    </script>
</body>
</html>
